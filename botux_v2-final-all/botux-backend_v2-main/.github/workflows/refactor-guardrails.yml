name: Refactor Guardrails

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup UV
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run refactor validation gates
        run: make validate-refactor

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refactor-validation-evidence
          path: docs/context/artifacts/refactor_validation/*.json
