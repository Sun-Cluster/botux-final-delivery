[project]
name = "botux-refactor"
version = "0.1.0"
description = "BOTUX backend refactor workspace"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.9.0",
  "tortoise-orm>=1.1.7",
  "asyncpg>=0.30.0",
  "python-dotenv>=1.0.1",
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "ib-insync>=0.9.86",
  "pyrefly>=1.0.0",
  "loguru>=0.7.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.tortoise]
tortoise_orm = "src.db.tortoise_orm.TORTOISE_ORM"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyrefly]
project-includes = [
    "scripts/**/*.py",
    "src/**/*.py",
]
project-excludes = [
    "tests/**",
]

[tool.pyrefly.errors]
unnecessary-type-conversion = false
